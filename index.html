<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>HackSim — Practice. Build. Defend. Improve.</title>
  <meta name="description" content="Practice the complete hackathon experience before the real event." />
  <meta name="theme-color" content="#fcfcfd" />
  <meta name="color-scheme" content="light" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HackSim" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script>
    // Applies the saved/system theme before React boots, so a dark-mode user
    // never sees a white flash on first paint.
    (function () {
      try {
        var stored = localStorage.getItem("hacksim-theme");
        var dark =
          stored === "dark" ||
          (!stored &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>

  <meta property="og:title" content="HackSim" />
  <meta property="og:description" content="Practice the complete hackathon experience before the real event." />
  <meta property="og:type" content="website" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

project_id = "hacksim"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[functions.analysis]
# The platform verifies the caller's JWT before the function runs, so the
# function can trust req.headers.get("Authorization") and use the service role
# client internally. Never disable this.
verify_jwt = true

[functions.ai-admin]
verify_jwt = true
